    .clock { font-size: 13px; color: #7a5265; font-variant-numeric: tabular-nums; }
    button { min-height: 44px; background: #fae9f0; border: 1px solid #edcdda; color: #71324c; border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s ease; }
    button:hover { background: #f4d6e3; }
    button:focus-visible, a:focus-visible { outline: 3px solid #ae476f; outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: wait; }
    #language { background: #fff7fb; }
    .direction-switch { display: none; }
    .boards, .stop-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .board, .network { background: #fffafc; border: 1px solid #efd4df; border-radius: 24px; overflow: hidden; box-shadow: 0 18px 48px #8e3e6410; }
    .route { padding: 26px 30px; background: linear-gradient(125deg, #783951, #984c6b); color: white; }
    .route-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .badge { background: #ffe2ee; color: #71324c; font-size: 28px; font-weight: 800; padding: 8px 16px; border-radius: 10px; }
    .operator, .from, .stop { color: #f8dce7; }
    .operator { font-size: 14px; }
    .from { margin: 0 0 8px; font-size: 15px; }
    h1 { margin: 0; font-weight: 650; font-size: clamp(25px, 3vw, 32px); letter-spacing: -.025em; overflow-wrap: anywhere; }
    .stop { margin: 12px 0 0; font-size: 14px; line-height: 1.7; }
    .content { padding: 24px 30px; }
    h2 { margin: 0; font-size: 14px; }
    [data-role="status"] { font-size: 13px; color: #80586b; text-align: right; }
    [data-role="status"][data-state="warning"] { color: #934621; }
    .notice { margin: 16px 0 0; padding: 12px 14px; border-radius: 10px; background: #fff0df; color: #87441f; font-size: 14px; line-height: 1.6; }
    .notice[hidden] { display: none; }
    [data-role="arrivals"] { list-style: none; padding: 0; margin: 16px 0 0; }
    .arrival { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; border-top: 1px solid #f0dfe7; }
    .arrival:first-child { border: 0; padding-top: 6px; }
    .arrival-label { font-size: 15px; font-weight: 600; }
    .detail { color: #80586b; font-size: 14px; margin-top: 6px; line-height: 1.6; }
    .time { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .minutes { font-size: 36px; font-weight: 650; letter-spacing: -.05em; }
    .arrival:first-child .minutes { font-size: 60px; }
    .unit { margin-left: 8px; color: #80586b; font-size: 14px; }
    .message { padding: 20px 0; color: #80586b; font-size: 14px; line-height: 1.7; }
    .refresh-bar { border-top: 1px solid #f0dfe7; margin-top: 8px; padding-top: 18px; align-items: flex-end; }
    .refresh-info { font-size: 12px; line-height: 1.9; color: #80586b; font-variant-numeric: tabular-nums; }
    .refresh-bar button { flex-shrink: 0; }
    .refresh-progress { height: 7px; border-radius: 99px; overflow: hidden; margin-top: 16px; background: #f7e5ed; }
    .progress-fill { width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d98bab, #ae476f); transform: scaleX(0); transform-origin: left; will-change: transform; }
    .refresh-progress[data-loading="true"] .progress-fill { width: 40%; animation: loading-slide 1.3s ease-in-out infinite; }
    @keyframes loading-slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
    footer { color: #7a5265; font-size: 13px; line-height: 1.9; padding: 22px 4px; }
    footer p { margin: 0 0 4px; }
    a { color: inherit; text-underline-offset: 3px; }
    .network { padding: 28px 30px; }
    .network > h2 { font-size: 20px; }
    .network-note { font-size: 13px; color: #80586b; margin: 8px 0 24px; line-height: 1.7; }

    .stop-list { list-style: none; margin: 0; padding: 0; }

    .station::before { content: ''; position: absolute; left: 15px; top: 30px; bottom: 0; width: 2px; background: #efd4df; }
    .station:last-child { padding-bottom: 0; }
    .station:last-child::before { display: none; }
    .station-number { flex: 0 0 32px; min-height: 32px; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: #f8e7ef; border-radius: 50%; z-index: 1; }
    .station-name { font-size: 14px; line-height: 1.6; padding-top: 4px; overflow-wrap: anywhere; }
    .station.is-key .station-number { background: #8b435f; color: white; }

    .station-tag { display: inline-block; margin: 5px 6px 0 0; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: #f7dce8; color: #71324c; }
    @media (max-width: 850px) {
      main { max-width: 680px; }

      .content, .network { padding: 22px; }
      .arrival:first-child .minutes { font-size: 52px; }
      .refresh-bar { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) { .refresh-progress[data-loading="true"] .progress-fill { animation: none; transform: scaleX(1); } }

          const label = document.createElement('div'); label.className = 'arrival-label'; label.textContent = TEXT[language].labels[index];
          const detail = document.createElement('div'); detail.className = 'detail';
          detail.textContent = hkTime(row.time).slice(0, 5) + ' · ' + (remark(row) || t('estimated'));
          info.append(label, detail);
          const time = document.createElement('div'); time.className = 'time';
          const minutes = document.createElement('span'); minutes.className = 'minutes';
          const remaining = (row.time - now) / 60000;
          minutes.textContent = remaining < 1 ? '<1' : String(Math.ceil(remaining));
          const unit = document.createElement('span'); unit.className = 'unit'; unit.textContent = t('minutes');
          time.append(minutes, unit); item.append(info, time); list.append(item);
        });
        if (!view.valid.length) {
          const message = document.createElement('li'); message.className = 'message';
          message.textContent = !state.hasData && !state.error ? t('checking') : state.error || view.stale ? t('noValid') : (view.remarks || t('empty'));
          list.append(message);
        }
        replaceIfChanged(el('arrivals'), list);
        el('checked').textContent = state.lastChecked ? t('checked') + hkTime(state.lastChecked) : t('notChecked');
        el('dataTime').textContent = state.dataTime ? t('dataTime') + hkTime(state.dataTime) : t('noDataTime');
        el('dataTime').title = state.dataTime ? new Date(state.dataTime).toISOString() : '';
        const secondsLeft = Math.max(0, Math.ceil((state.nextRefresh - now) / 1000));
        el('countdown').textContent = state.loading ? t('fetching') : t('countdown', { seconds: secondsLeft });
        el('refresh').disabled = state.loading;
        el('progress').dataset.loading = String(state.loading);
        el('progress').setAttribute('aria-label', t('progress'));
        el('progress').setAttribute('aria-valuetext', state.loading ? t('fetching') : t('countdown', { seconds: secondsLeft }));
        if (state.loading) el('progress').removeAttribute('aria-valuenow');
        else {
          const elapsed = Math.max(0, Math.min(30, 30 - (state.nextRefresh - now) / 1000));
          el('progress').setAttribute('aria-valuenow', elapsed.toFixed(1));
          if (reducedMotion.matches) progressFill.style.transform = 'scaleX(' + elapsed / 30 + ')';
        }
      }

      async function refresh() {
        if (state.loading) return;
        state.loading = true; state.nextRefresh = Date.now() + REFRESH_MS; render();
        const abort = new AbortController();
        const timeout = setTimeout(() => abort.abort(), 12000);
        try {
          const response = await fetch('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/' + config.stop + '/B3A', { cache: 'no-store', signal: abort.signal });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const parsed = parsePayload(await response.json(), config);
          state.rows = parsed.rows; state.dataTime = parsed.dataTime;
          state.lastChecked = Date.now(); state.hasData = true; state.error = false;
        } catch (error) {
          // Preserve the last successful response. getView removes expired data.
          state.error = true;
          console.warn('Citybus ETA request failed:', config.id, error);
        } finally {
          clearTimeout(timeout); state.loading = false; render();
        }
      }
      el('refresh').addEventListener('click', refresh);
      return {
        render, refresh,
        tick() { if (!state.loading && Date.now() >= state.nextRefresh) refresh(); else render(); },
        animate(now) {
          if (!state.loading && !reducedMotion.matches) progressFill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, 1 - (state.nextRefresh - now) / REFRESH_MS)) + ')';
        }
      };
    }

    function renderStops() {
      document.getElementById('network-note').textContent = t('networkNote', { date: ROUTE_DATA.checked });
      const columns = document.createDocumentFragment();
      CONFIGS.forEach(config => {
        const column = document.createElement('div');
        const heading = document.createElement('h3'); heading.textContent = t(config.route);
        const list = document.createElement('ol'); list.className = 'stop-list'; list.setAttribute('aria-label', t(config.route));
        // Group consecutive duplicate API entries, retaining their original sequence numbers.
        const grouped = [];
        ROUTE_DATA[config.id].forEach(stop => {
          const previous = grouped[grouped.length - 1];
          if (previous && previous.stop === stop.stop) previous.end = stop.seq;
          else grouped.push({ ...stop, end: stop.seq });
        });
        grouped.forEach(stop => {
          const item = document.createElement('li'); item.className = 'station';
          const number = document.createElement('span'); number.className = 'station-number'; number.textContent = stop.seq === stop.end ? String(stop.seq) : stop.seq + '–' + stop.end;
          const info = document.createElement('div');
          const name = document.createElement('div'); name.className = 'station-name'; name.textContent = ROUTE_DATA.names[stop.stop][language];
          info.append(name);
          const tag = stop.stop === config.boarding ? 'boardHere' : stop.stop === config.alighting ? 'alightHere' : null;
          if (tag) {
            item.classList.add('is-key');
            const badge = document.createElement('span'); badge.className = 'station-tag'; badge.textContent = t(tag); info.append(badge);
          }
          item.append(number, info); list.append(item);
        });
        column.append(heading, list); columns.append(column);
      });
      document.getElementById('stop-columns').replaceChildren(columns);
    }

    function updateClock() { document.getElementById('clock').textContent = hkTime(Date.now()) + ' ' + t('hk'); }
    function renderLanguage() {
      document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
      document.title = t('title');
      document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
      document.getElementById('directions').setAttribute('aria-label', t('directions'));
      const button = document.getElementById('language');
      button.textContent = language === 'en' ? '中文' : 'English';
      button.lang = language === 'en' ? 'zh-CN' : 'en';
      button.setAttribute('aria-label', t('languageLabel'));
      controllers.forEach(controller => controller.render());
      renderStops(); updateClock();
    }
    document.getElementById('language').addEventListener('click', () => {
      language = language === 'en' ? 'zh' : 'en';
      try { localStorage.setItem('b3a-language', language); } catch {}
      renderLanguage();
    });
    document.querySelectorAll('[data-direction]').forEach(button => button.addEventListener('click', () => {
      activeDirection = button.dataset.direction;
      document.querySelectorAll('[data-direction]').forEach(option => option.setAttribute('aria-pressed', String(option.dataset.direction === activeDirection)));
      controllers.forEach(controller => controller.render());
    }));
    CONFIGS.forEach(config => controllers.push(makeBoard(config)));
    renderLanguage();
    controllers.forEach(controller => controller.refresh());
    setInterval(() => { updateClock(); controllers.forEach(controller => controller.tick()); }, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) controllers.forEach(controller => controller.tick()); });
    window.addEventListener('online', () => controllers.forEach(controller => controller.refresh()));
    function animate() {
      const now = Date.now();
      if (!document.hidden) controllers.forEach(controller => controller.animate(now));
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
